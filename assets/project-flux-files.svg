<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" fill="none">
  <defs>
    <linearGradient id="fluxGrad" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121319"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="640" height="240" rx="12" fill="url(#fluxGrad)" stroke="#22222E" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect width="640" height="34" rx="12" fill="#15161E"/>
  <path d="M0 34 L640 34" stroke="#22222E" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="17" r="4.5" fill="#2E2E3C"/>
  <circle cx="34" cy="17" r="4.5" fill="#2E2E3C"/>
  <circle cx="48" cy="17" r="4.5" fill="#2E2E3C"/>

  <!-- Title & Status -->
  <text x="74" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F1F0ED" font-weight="600" letter-spacing="0.5">
    Flux Files // High-Throughput Desktop File Manager
  </text>
  <rect x="520" y="8" width="104" height="18" rx="3" fill="#1C1C28" stroke="#2E2A44" stroke-width="1"/>
  <circle cx="530" cy="17" r="3" fill="#9277FF"/>
  <text x="538" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#9277FF" font-weight="600">RELEASES</text>

  <!-- Navigation Breadcrumbs Bar -->
  <rect x="12" y="44" width="616" height="24" rx="4" fill="#0E0E14" stroke="#1E1E26" stroke-width="1"/>
  <text x="24" y="60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71707E">
    ROOT <tspan fill="#C7F36B">/</tspan> Volumes <tspan fill="#C7F36B">/</tspan> Projects <tspan fill="#C7F36B">/</tspan> <tspan fill="#F1F0ED">Active_Workspaces</tspan>
  </text>
  <rect x="540" y="47" width="80" height="18" rx="3" fill="#171822"/>
  <text x="550" y="60" font-family="'JetBrains Mono', monospace" font-size="8" fill="#C7F36B">60 FPS UI</text>

  <!-- Left: Drive Topology & Bookmarks -->
  <rect x="12" y="78" width="140" height="150" rx="6" fill="#0D0E13" stroke="#1E1E28" stroke-width="1"/>
  <text x="22" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71707E" letter-spacing="1">VOLUMES</text>

  <g font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#A4A3AA">
    <text x="22" y="116" fill="#C7F36B">⚡ NVMe Primary</text>
    <text x="22" y="134">💾 Work Archive</text>
    <text x="22" y="152">☁ Remote Mount</text>
    <text x="22" y="178" fill="#71707E">TAGS</text>
    <text x="22" y="196"><tspan fill="#9277FF">●</tspan> Dev Source</text>
    <text x="22" y="214"><tspan fill="#C7F36B">●</tspan> High Priority</text>
  </g>

  <!-- Center: File Grid View -->
  <rect x="162" y="78" width="310" height="150" rx="6" fill="#0B0B0F" stroke="#1E1E28" stroke-width="1"/>

  <!-- Grid Item 1 -->
  <g transform="translate(174, 90)">
    <rect width="66" height="54" rx="4" fill="#14141C" stroke="#252535" stroke-width="1"/>
    <path d="M12 14 L28 14 L34 20 L54 20 L54 44 L12 44 Z" fill="#20202E" stroke="#3A3A4F" stroke-width="1"/>
    <text x="33" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#C7F36B">SRC</text>
    <text x="33" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#A4A3AA">core/</text>
  </g>

  <!-- Grid Item 2 (Selected Item) -->
  <g transform="translate(248, 90)">
    <rect width="66" height="54" rx="4" fill="#171824" stroke="#9277FF" stroke-width="1.2"/>
    <path d="M12 14 L28 14 L34 20 L54 20 L54 44 L12 44 Z" fill="#221E36" stroke="#9277FF" stroke-width="1"/>
    <text x="33" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#9277FF">SYS</text>
    <text x="33" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#F1F0ED">kernel/</text>
  </g>

  <!-- Grid Item 3 -->
  <g transform="translate(322, 90)">
    <rect width="66" height="54" rx="4" fill="#14141C" stroke="#252535" stroke-width="1"/>
    <path d="M12 14 L28 14 L34 20 L54 20 L54 44 L12 44 Z" fill="#20202E" stroke="#3A3A4F" stroke-width="1"/>
    <text x="33" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#A4A3AA">MOD</text>
    <text x="33" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#A4A3AA">assets/</text>
  </g>

  <!-- Grid Item 4 -->
  <g transform="translate(396, 90)">
    <rect width="66" height="54" rx="4" fill="#14141C" stroke="#252535" stroke-width="1"/>
    <circle cx="33" cy="28" r="12" fill="#1C1F2B" stroke="#2D3B26" stroke-width="1"/>
    <text x="33" y="31" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#C7F36B">EXE</text>
    <text x="33" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#A4A3AA">flux.bin</text>
  </g>

  <!-- Lower File Table in Grid -->
  <g transform="translate(174, 154)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#888795">
    <line x1="0" y1="0" x2="286" y2="0" stroke="#1D1D28" stroke-width="1"/>
    <text x="4" y="16" fill="#F1F0ED">FluxFiles-Setup-v1.0.exe</text>
    <text x="180" y="16">64.2 MB</text>
    <text x="240" y="16" fill="#C7F36B">WIN-x64</text>

    <text x="4" y="34" fill="#F1F0ED">FluxFiles-Darwin-Universal.dmg</text>
    <text x="180" y="34">72.1 MB</text>
    <text x="240" y="34" fill="#9277FF">MACOS</text>

    <text x="4" y="52" fill="#F1F0ED">FluxFiles-x86_64.AppImage</text>
    <text x="180" y="52">58.4 MB</text>
    <text x="240" y="52" fill="#A4A3AA">LINUX</text>
  </g>

  <!-- Right: Inspector Telemetry -->
  <rect x="482" y="78" width="146" height="150" rx="6" fill="#0D0E13" stroke="#1E1E28" stroke-width="1"/>
  <text x="494" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71707E" letter-spacing="1">SPECIFICATION</text>

  <g transform="translate(494, 110)" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#A4A3AA">
    <text x="0" y="0">PLATFORM: Desktop</text>
    <text x="0" y="16">INDEX: Zero-lag cache</text>
    <text x="0" y="32">KEYBOARD: 100% nav</text>
    <text x="0" y="48">STATUS: Stable builds</text>

    <rect y="60" width="122" height="32" rx="4" fill="#151520" stroke="#252535" stroke-width="1"/>
    <text x="8" y="74" fill="#C7F36B">impreseo/</text>
    <text x="8" y="86" fill="#888795">flux-files-releases</text>
  </g>
</svg>
