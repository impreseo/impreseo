<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" fill="none">
  <defs>
    <linearGradient id="podeGrad" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="podeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7F36B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9277FF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="640" height="240" rx="12" fill="url(#podeGrad)" stroke="#22222D" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect width="640" height="34" rx="12" fill="#16161D"/>
  <path d="M0 34 L640 34" stroke="#22222D" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="17" r="4.5" fill="#2E2E3C"/>
  <circle cx="34" cy="17" r="4.5" fill="#2E2E3C"/>
  <circle cx="48" cy="17" r="4.5" fill="#2E2E3C"/>

  <!-- Title & Status -->
  <text x="74" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F1F0ED" font-weight="600" letter-spacing="0.5">
    P.ODE // Project-Oriented Development Environment
  </text>
  <rect x="520" y="8" width="104" height="18" rx="3" fill="#1C1C26" stroke="#2B2B3B" stroke-width="1"/>
  <circle cx="530" cy="17" r="3" fill="#C7F36B"/>
  <text x="538" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#C7F36B" font-weight="600">ACTIVE DEV</text>

  <!-- Left Sidebar: Project File Explorer -->
  <rect x="12" y="46" width="150" height="182" rx="6" fill="#0E0E12" stroke="#1E1E26" stroke-width="1"/>
  <text x="24" y="66" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#71707E" letter-spacing="1">PROJECT TREE</text>
  
  <!-- File entries -->
  <g font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#A4A3AA">
    <text x="24" y="88" fill="#C7F36B">▾ src/core</text>
    <text x="36" y="106">  engine.ts</text>
    <text x="36" y="124">  workspace.ts</text>
    <text x="36" y="142">  ast_parser.ts</text>
    <text x="24" y="162" fill="#9277FF">▾ components</text>
    <text x="36" y="180">  EditorPane.tsx</text>
    <text x="36" y="198">  Terminal.tsx</text>
    <text x="24" y="218">▸ pode.config.json</text>
  </g>

  <!-- Center: Editor Buffer -->
  <rect x="172" y="46" width="280" height="182" rx="6" fill="#0D0D11" stroke="#1E1E26" stroke-width="1"/>
  
  <!-- Tab Bar -->
  <rect x="172" y="46" width="120" height="24" rx="6" fill="#171720"/>
  <text x="186" y="62" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#F1F0ED">workspace.ts</text>
  <circle cx="276" cy="58" r="2.5" fill="#C7F36B"/>

  <!-- Code Buffer Preview -->
  <g font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#A4A3AA">
    <text x="186" y="88"><tspan fill="#9277FF">export class</tspan> <tspan fill="#F1F0ED">Workspace</tspan> {</text>
    <text x="198" y="106"><tspan fill="#9277FF">readonly</tspan> id: <tspan fill="#C7F36B">ProjectID</tspan>;</text>
    <text x="198" y="124"><tspan fill="#71707E">// Project-oriented context graph</tspan></text>
    <text x="198" y="142"><tspan fill="#9277FF">async</tspan> mount() {</text>
    <text x="210" y="160"><tspan fill="#C7F36B">await</tspan> this.ast.hydrate();</text>
    <text x="210" y="178">return this.dispatch();</text>
    <text x="198" y="196">}</text>
    <text x="186" y="214">}</text>
  </g>

  <!-- Right: Architecture Diagnostics & Pipeline -->
  <rect x="462" y="46" width="166" height="182" rx="6" fill="#0E0E12" stroke="#1E1E26" stroke-width="1"/>
  <text x="474" y="66" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#71707E" letter-spacing="1">CONTEXT PIPELINE</text>

  <!-- Diagnostics Node Blocks -->
  <g transform="translate(474, 80)">
    <rect width="142" height="34" rx="4" fill="#14141B" stroke="#252535" stroke-width="1"/>
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F1F0ED">AST Graph Linker</text>
    <text x="10" y="26" font-family="'JetBrains Mono', monospace" font-size="7" fill="#C7F36B">0.42ms · Zero Latency</text>

    <rect y="44" width="142" height="34" rx="4" fill="#14141B" stroke="#252535" stroke-width="1"/>
    <text x="10" y="60" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F1F0ED">Project Isolation</text>
    <text x="10" y="70" font-family="'JetBrains Mono', monospace" font-size="7" fill="#9277FF">Sandboxed Workspaces</text>

    <rect y="88" width="142" height="42" rx="4" fill="#131518" stroke="#2A3828" stroke-width="1"/>
    <text x="10" y="104" font-family="'JetBrains Mono', monospace" font-size="8" fill="#C7F36B">podeide.netlify.app</text>
    <text x="10" y="118" font-family="'JetBrains Mono', monospace" font-size="7" fill="#888795">Web IDE Architecture</text>
  </g>
</svg>
