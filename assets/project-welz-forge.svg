<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" fill="none">
  <defs>
    <linearGradient id="welzGrad" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14131B"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="forgeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7F36B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9277FF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="640" height="240" rx="12" fill="url(#welzGrad)" stroke="#272236" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect width="640" height="34" rx="12" fill="#181522"/>
  <path d="M0 34 L640 34" stroke="#272236" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="17" r="4.5" fill="#2E2E3C"/>
  <circle cx="34" cy="17" r="4.5" fill="#2E2E3C"/>
  <circle cx="48" cy="17" r="4.5" fill="#2E2E3C"/>

  <!-- Title & Status -->
  <text x="74" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F1F0ED" font-weight="600" letter-spacing="0.5">
    WELZ FORGE // Community Initiative &amp; Builder Network
  </text>
  <rect x="520" y="8" width="104" height="18" rx="3" fill="#1F1B2B" stroke="#3D3256" stroke-width="1"/>
  <circle cx="530" cy="17" r="3" fill="#C7F36B"/>
  <text x="538" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#C7F36B" font-weight="600">INITIATIVE</text>

  <!-- Left: Forge Anvil & Network Core -->
  <g transform="translate(24, 52)">
    <rect width="180" height="168" rx="8" fill="#100F17" stroke="#241E34" stroke-width="1"/>
    
    <!-- Anvil / Geometric Crest -->
    <path d="M40 70 L140 70 L130 92 L106 92 L106 112 L120 128 L60 128 L74 112 L74 92 L50 92 Z" 
          fill="#1E192E" stroke="#9277FF" stroke-width="1.5"/>
    <circle cx="90" cy="80" r="4" fill="#C7F36B"/>
    <line x1="90" y1="50" x2="90" y2="70" stroke="#C7F36B" stroke-width="2" stroke-dasharray="2 3"/>

    <!-- Sparks / Energy -->
    <circle cx="68" cy="62" r="2" fill="#C7F36B"/>
    <circle cx="112" cy="62" r="2" fill="#9277FF"/>
    <circle cx="90" cy="46" r="2.5" fill="#FFFFFF"/>

    <text x="90" y="148" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#F1F0ED">
      WELZ FORGE
    </text>
    <text x="90" y="164" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#C7F36B" letter-spacing="1">
      BUILD WHAT'S NEXT.
    </text>
  </g>

  <!-- Center: Pillars of the Initiative -->
  <g transform="translate(218, 52)">
    <rect width="250" height="168" rx="8" fill="#0E0D14" stroke="#221C30" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#888795" letter-spacing="1">MISSION &amp; ECOSYSTEM</text>

    <!-- Pillar 1 -->
    <g transform="translate(16, 36)">
      <rect width="218" height="34" rx="4" fill="#151320" stroke="#2A243D" stroke-width="1"/>
      <circle cx="12" cy="17" r="3" fill="#C7F36B"/>
      <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F1F0ED" font-weight="600">Events &amp; Hackathons</text>
      <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8E8D9C">College competitions, workshops, challenges</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(16, 76)">
      <rect width="218" height="34" rx="4" fill="#151320" stroke="#2A243D" stroke-width="1"/>
      <circle cx="12" cy="17" r="3" fill="#9277FF"/>
      <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F1F0ED" font-weight="600">Project Showcases</text>
      <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8E8D9C">Peer feedback, collaborative building, demos</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(16, 116)">
      <rect width="218" height="34" rx="4" fill="#151320" stroke="#2A243D" stroke-width="1"/>
      <circle cx="12" cy="17" r="3" fill="#C7F36B"/>
      <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F1F0ED" font-weight="600">Resource &amp; Knowledge Hub</text>
      <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8E8D9C">Shared tooling, tech guides, opportunities</text>
    </g>
  </g>

  <!-- Right: Community Channels -->
  <g transform="translate(480, 52)">
    <rect width="146" height="168" rx="8" fill="#100F17" stroke="#241E34" stroke-width="1"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="8" fill="#888795" letter-spacing="1">COMMUNITY</text>

    <g transform="translate(14, 38)" font-family="'JetBrains Mono', monospace" font-size="7.5">
      <rect width="118" height="36" rx="4" fill="#151522" stroke="#2A2440" stroke-width="1"/>
      <text x="8" y="16" fill="#C7F36B">WhatsApp Group</text>
      <text x="8" y="28" fill="#A4A3AA">Builders chat</text>

      <rect y="44" width="118" height="36" rx="4" fill="#151522" stroke="#2A2440" stroke-width="1"/>
      <text x="8" y="60" fill="#9277FF">Broadcast Channel</text>
      <text x="8" y="72" fill="#A4A3AA">Curated feeds</text>

      <rect y="90" width="118" height="26" rx="4" fill="#181524" stroke="#3D3058" stroke-width="1"/>
      <text x="8" y="106" fill="#F1F0ED">Open to Builders</text>
    </g>
  </g>
</svg>
